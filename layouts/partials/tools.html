<div class="container section-spacing-top">
    <div class="d-flex justify-content-between align-items-center">
        <hr class="flex-grow-1 hr-large">
    </div>
    <div class="album">
        <div class="container">
            <div class="row section-spacing-top">
                {{ range $index, $element:= hugo.Data.tools.tools }}
                <div class="col-md-4">
                    <div class="card mb-4 box-shadow">
                        {{ with .image }}
                        <img src="{{.}}" class="card-img-top" alt="{{ $element.name }} logo">
                        {{ end }}
                        {{with .description}}
                        <div class="card-body">
                            <div class="card-text">
                                <p class="tool-description">
                                    {{ . }}
                                </p>
                                {{ end }}
                                <div class="d-flex flex-column flex-sm-row">
                                    <div class="d-flex flex-wrap">
                                        {{ with .url }}
                                        <a href="{{ . }}" class="btn github-btn" target="_blank">
                                            <i class="ion-social-github-outline"></i>
                                            View on GitHub
                                          </a>
                                        {{ end }}
                                        {{ with .paper }}
                                        <a href="{{ . }}" class="btn github-btn" target="_blank">
                                            <i class="ion-document-text"></i>
                                            Read the Paper
                                        </a>
                                        {{ end }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                {{ end }}
            </div>
        </div>
    </div>
</div>
