<footer id="footer">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8 col-sm-12">
        <div class="copyright">
          <p>
            Copyright {{ now.Format "2006" }}
            {{ with .Site.Params.copyright }}
              {{ . | markdownify }}
            {{ else }}
              {{ .Site.Title }}. Based on theme developed by <a href="https://themefisher.com" target="_blank" rel="noopener">Themefisher</a>.<br>
              Visit their store for bootstrap themes: <a href="https://themefisher.com" target="_blank" rel="noopener">Store</a>
            {{ end }}
          </p>
        </div>
      </div>
      <div class="col-md-4 col-sm-12">
        <ul class="social">
          {{ range .Site.Params.footer.social }}
            <li>
              <a href="{{ .link | safeURL }}" target="_blank" rel="noopener" aria-label="{{ .name }}">
                <i class="{{ .icon }}"></i>
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
</footer>

<button id="back-to-top" class="back-to-top" title="Volver arriba" aria-label="Volver arriba">
    <i class="ion-chevron-up"></i>
</button>

<button id="back-to-top" class="back-to-top" title="Volver arriba" aria-label="Volver arriba">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const backToTopBtn = document.getElementById("back-to-top");
    if (backToTopBtn) {
        const toggleBackToTop = () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add("show");
            } else {
                backToTopBtn.classList.remove("show");
            }
        };

        toggleBackToTop();
        window.addEventListener("scroll", toggleBackToTop);

        backToTopBtn.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    }
});
</script>
